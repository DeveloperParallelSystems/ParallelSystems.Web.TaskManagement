# Parallel Systems Task Management deployment-managed snippet
# Included inside the existing Timesheet content server; keep API/TLS settings.
location = /task-management {
    return 308 /task-management/$is_args$args;
}

location ^~ /task-management/assets/ {
    root /var/www/parallel-systems-task-management/current;
    try_files $uri =404;
    expires 365d;
}

location = /task-management/logo.png {
    root /var/www/parallel-systems-task-management/current;
    try_files $uri =404;
    expires -1;
}

location ^~ /task-management/ {
    root /var/www/parallel-systems-task-management/current;
    try_files $uri $uri/ /task-management/index.html;
    expires -1;
}
